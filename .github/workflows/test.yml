name: Tests

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  test:
    name: Test on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-14
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: linux
            arch: x64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            arch: x64
            runner: windows-2022
          - os: windows
            arch: arm64
            runner: windows-11-arm
            optional: true

    continue-on-error: ${{ matrix.optional == true }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native module from source
        # fcntl() is a Unix/POSIX API that doesn't exist on Windows.
        # Windows uses LockFileEx/UnlockFileEx instead, which are unchanged.
        if: runner.os != 'Windows'
        run: |
          npx node-gyp rebuild
          # Move prebuilt binaries so tests use freshly compiled module
          mv binaries binaries.bak

      - name: Run tests
        run: npm test
