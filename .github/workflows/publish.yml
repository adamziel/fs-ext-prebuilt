name: Publish to npm

on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: 'Version bump type'
                required: true
                type: choice
                options:
                    - patch
                    - minor
                    - major

            only_if_needed:
                description: 'Publish only changed package inputs, or retry an unpublished version'
                type: boolean
                default: false
            source_ref:
                description: 'Exact tested commit (defaults to trunk for manual releases)'
                type: string
                default: ''

permissions:
    id-token: write # required for OIDC
    contents: write

concurrency:
    group: publish-npm
    cancel-in-progress: false

jobs:
    publish:
        name: Publish tested prebuilds
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.source_ref || 'trunk' }}
                  fetch-depth: 0

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  package-manager-cache: false

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Validate complete binary set
              run: node .github/scripts/check-prebuild-targets.js validate

            - name: Prepare a new release or retry an unpublished version
              id: prepare
              env:
                  VERSION_BUMP: ${{ inputs.version_bump }}
                  ONLY_IF_NEEDED: ${{ inputs.only_if_needed }}
              run: node .github/scripts/prepare-release.js

            - name: Commit the pending release
              if: steps.prepare.outputs.publish == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json
                  if ! git diff --staged --quiet; then
                    git commit -m "v${{ steps.prepare.outputs.version }}"
                    git push origin HEAD:trunk
                  fi

            - name: Publish to npm
              if: steps.prepare.outputs.publish == 'true'
              run: npm publish --access public

            - name: Tag the published release
              env:
                  VERSION: ${{ steps.prepare.outputs.version }}
              run: |
                  if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
                    git tag "v$VERSION"
                    git push origin "v$VERSION"
                  fi
