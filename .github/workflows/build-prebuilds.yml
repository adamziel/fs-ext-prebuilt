name: Build fs-ext prebuilds

on:
  schedule:
    # Check daily for new Node ABI targets and Studio Electron upgrades.
    - cron: '17 3 * * *'
  push:
    branches: [trunk]
    paths:
      - 'fs-ext.cc'
  workflow_dispatch:
    inputs:
      node_versions:
        description: 'Optional comma/space separated Node.js versions (defaults to >=20 from ABI registry)'
        required: false
        default: ''
      electron_version:
        description: 'Optional Electron version override'
        required: false
        default: ''

permissions:
  actions: write
  contents: write

concurrency:
  group: build-prebuilds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-upstream-targets:
    name: Detect upstream target changes
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect required prebuild targets
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          NODE_VERSIONS: ${{ inputs.node_versions }}
          ELECTRON_VERSION: ${{ inputs.electron_version }}
        run: node .github/scripts/check-prebuild-targets.js detect

  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    needs: detect-upstream-targets
    if: needs.detect-upstream-targets.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - os: macos
            arch: arm64
            runner: macos-14
          # macOS x64 (Intel)
          - os: macos
            arch: x64
            runner: macos-15-intel
          # Linux x64
          - os: linux
            arch: x64
            runner: ubuntu-24.04
          # Linux arm64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          # Windows x64
          - os: windows
            arch: x64
            runner: windows-2022
          # Windows arm64 (runner may not be available in all repos)
          - os: windows
            arch: arm64
            runner: windows-11-arm
            optional: true

    # Allow Windows ARM64 to fail if runner is unavailable
    continue-on-error: ${{ matrix.optional == true }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install LLVM Clang (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build prebuilds (macOS)
        if: matrix.os == 'macos'
        env:
          NODE_VERSIONS: ${{ inputs.node_versions }}
          ELECTRON_VERSION: ${{ inputs.electron_version }}
          REFRESH_ABI: 1
          # Use LLVM Clang on macOS for full C++20 NTTP support (Apple Clang lacks it)
          CC: clang
          CXX: clang++
        run: node prebuildify.js

      - name: Build prebuilds
        if: matrix.os != 'macos'
        env:
          NODE_VERSIONS: ${{ inputs.node_versions }}
          ELECTRON_VERSION: ${{ inputs.electron_version }}
          REFRESH_ABI: 1
        run: node prebuildify.js

      - name: List built binaries
        run: ls -la binaries/
        shell: bash

      - name: Run tests
        run: npm test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: binaries/*.node

      - name: Upload ABI registry (once)
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: abi-registry
          path: abi-registry.json

  commit:
    name: Commit binaries to trunk
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trunk
          fetch-depth: 0

      - name: Prepare workspace
        run: |
          rm -rf binaries
          mkdir -p binaries

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: binaries

      - name: Download ABI registry
        uses: actions/download-artifact@v4
        with:
          name: abi-registry
          path: .
        continue-on-error: true

      - name: List binaries
        run: ls -la binaries/

      - name: Validate complete binary set
        env:
          NODE_VERSIONS: ${{ inputs.node_versions }}
          ELECTRON_VERSION: ${{ inputs.electron_version }}
        run: node .github/scripts/check-prebuild-targets.js validate

      - name: Commit and push to trunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add binaries/ abi-registry.json
          if git diff --staged --quiet -- binaries; then
            BINARY_CHANGES=0
          else
            BINARY_CHANGES=1
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh fs-ext prebuilds

          Platforms:
          - macOS: x64, arm64
          - Linux: x64, arm64
          - Windows: x64, arm64

          Node versions: ${{ inputs.node_versions || 'ABI registry (>=20)' }}
          Electron version: ${{ inputs.electron_version || 'Studio package.json' }}
          Triggered by: ${{ github.actor }}"
            git push origin trunk
            if [ "$BINARY_CHANGES" = "1" ]; then
              gh workflow run publish.yml --ref trunk -f version_bump=patch
            fi
          fi
