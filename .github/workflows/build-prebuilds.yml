name: Build fs-ext prebuilds

on:
  workflow_dispatch:
    inputs:
      node_versions:
        description: 'Optional comma/space separated Node.js versions (defaults to >=20 from ABI registry)'
        required: false
        default: ''
      electron_version:
        description: 'Optional Electron version override'
        required: false
        default: ''
      branch_suffix:
        description: 'Optional suffix for the automation branch name'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build prebuilds
        env:
          NODE_VERSIONS: ${{ inputs.node_versions }}
          ELECTRON_VERSION: ${{ inputs.electron_version }}
          REFRESH_ABI: 1
        run: node prebuildify.js

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: binaries/*.node

      - name: Upload ABI registry (once)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: abi-registry
          path: abi-registry.json

  create-pr:
    name: Create PR with refreshed prebuilds
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare workspace
        run: |
          rm -rf binaries
          mkdir -p binaries

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: binaries

      - name: Download ABI registry
        uses: actions/download-artifact@v4
        with:
          name: abi-registry
          path: .
        continue-on-error: true

      - name: Compute branch name
        run: |
          base=automation/fs-ext-prebuilds
          suffix="${{ inputs.branch_suffix }}"
          if [ -n "$suffix" ]; then
            echo "BRANCH_NAME=${base}-${suffix}" >> "$GITHUB_ENV"
          else
            echo "BRANCH_NAME=${base}-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: refresh fs-ext prebuilds'
          branch: ${{ env.BRANCH_NAME }}
          base: trunk
          title: 'chore: refresh fs-ext prebuilds'
          body: |
            Automated refresh of fs-ext prebuild binaries.

            - Triggered by: ${{ github.actor }}
            - Node versions: ${{ inputs.node_versions || 'ABI registry (>=20)' }}
            - Electron version: ${{ inputs.electron_version || 'Studio package.json' }}
          add-paths: |
            binaries/
            abi-registry.json
          labels: automation
