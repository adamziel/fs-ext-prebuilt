name: Build fs-ext prebuilds

on:
  schedule:
    # Check daily for new Node ABI targets and Studio Electron upgrades.
    - cron: '17 3 * * *'
  push:
    branches: [trunk]
    paths:
      - 'fs-ext.cc'
      - 'binding.gyp'
      - 'src/**'
      - 'prebuildify.js'
      - 'load-prebuilt.js'
      - 'install.js'
      - 'patch-nan-v8-14.js'
      - '.github/**'
  pull_request:
    branches: [trunk]
  workflow_dispatch:
    inputs:
      node_versions:
        description: 'Optional released Node versions to select newer headers without dropping other ABIs'
        required: false
        default: ''
      electron_version:
        description: 'Optional exact Electron version override'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: build-prebuilds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-upstream-targets:
    name: Detect upstream target changes
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      node_versions: ${{ steps.detect.outputs.node_versions }}
      platforms: ${{ steps.detect.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - name: Test target selection, loading, and release decisions
        run: node --test tests/prebuild-targets.test.js tests/load-prebuilt.test.js

      - name: Detect required prebuild targets
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          NODE_VERSIONS: ${{ inputs.node_versions }}
          ELECTRON_VERSION: ${{ inputs.electron_version }}
        run: node .github/scripts/check-prebuild-targets.js detect

      - name: Freeze target snapshot for all jobs
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-targets
          path: prebuild-targets.json
          if-no-files-found: error

  build:
    name: Build on ${{ matrix.platform.os }} (${{ matrix.platform.arch }})
    needs: detect-upstream-targets
    if: needs.detect-upstream-targets.outputs.should_build == 'true'
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.detect-upstream-targets.outputs.platforms) }}
    env:
      PREBUILD_TARGETS_PATH: prebuild-targets.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prebuild-targets
          path: .

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install LLVM Clang (macOS)
        if: matrix.platform.os == 'macos'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build prebuilds (macOS)
        if: matrix.platform.os == 'macos'
        env:
          # Use LLVM Clang on macOS for full C++20 NTTP support (Apple Clang lacks it)
          CC: clang
          CXX: clang++
        run: node prebuildify.js

      - name: Build prebuilds
        if: matrix.platform.os != 'macos'
        run: node prebuildify.js

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: binaries/*.node
          if-no-files-found: error

  test:
    name: Test Node ${{ matrix.node }} on ${{ matrix.platform.os }} (${{ matrix.platform.arch }})
    needs: [detect-upstream-targets, build]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.detect-upstream-targets.outputs.node_versions) }}
        platform: ${{ fromJSON(needs.detect-upstream-targets.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the target Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Remember the target Node executable
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'PREBUILD_TEST_NODE=' + process.execPath + '\n')"

      # Keep npm and build tools on Node 24. Only the native tests need to run
      # in the target runtime; older bundled npm versions can fail to pack.
      - name: Use Node.js 24 for package tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true

      - name: Replace checked-in binaries with this run's artifacts
        run: |
          node -e "require('fs').rmSync('binaries', { recursive: true, force: true })"

      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: binaries

      - name: Install test dependencies without compiling a local addon
        run: npm ci --ignore-scripts

      - name: Compile the package and test workers
        run: |
          npm run build
          npm run build:workers

      - name: Run native lock tests in the target runtime
        shell: bash
        run: |
          "$PREBUILD_TEST_NODE" --version
          "$PREBUILD_TEST_NODE" --test tests/prebuild-targets.test.js tests/load-prebuilt.test.js
          "$PREBUILD_TEST_NODE" node_modules/tsx/dist/cli.mjs ./run_tests.ts
          "$PREBUILD_TEST_NODE" node_modules/jest/bin/jest.js tests/fcntl-range-locks.test.ts

      - name: Pack the npm package
        run: npm pack --ignore-scripts

      - name: Test installation without install scripts or a local build
        shell: bash
        run: node tests/packed-prebuild.cjs fs-ext-extra-prebuilt-*.tgz

  commit:
    name: Commit tested binaries to trunk
    needs: [build, test]
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: prebuild-targets
          path: .

      - name: Prepare workspace
        run: |
          rm -rf binaries
          mkdir -p binaries

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: binaries

      - name: Validate complete binary set
        run: node .github/scripts/check-prebuild-targets.js validate

      - name: Commit and push to trunk
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add binaries/ prebuild-targets.json
          if ! git diff --staged --quiet; then
            git commit -m "Build prebuilt binaries for released Node ABIs"
            git push origin HEAD:trunk
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish or retry the pending release
    needs: [detect-upstream-targets, build, test, commit]
    if: >-
      always() && github.ref == 'refs/heads/trunk' &&
      needs.detect-upstream-targets.result == 'success' &&
      (needs.detect-upstream-targets.outputs.should_build == 'false' ||
      (needs.build.result == 'success' && needs.test.result == 'success' && needs.commit.result == 'success'))
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      version_bump: patch
      only_if_needed: true
      source_ref: ${{ needs.commit.outputs.sha || github.sha }}
